name: Build AK-1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform from the current Flutter SDK
        run: flutter create --platforms=android --org com.ak1 --project-name ak1 .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK1-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
